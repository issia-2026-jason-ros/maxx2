- device_id: sample_roscore #device identifier. It is up to the designer to choose this name.
  
  className:  embedded.mas.bridges.ros.RosMaster
  
  microcontroller:
      id: ros1 
      className: DefaultRos4EmbeddedMas
      connectionString: ws://localhost:9090 

  perceptionTopics:

      # Motor status
      - topicName: /arduino/motor/status
        topicType: std_msgs/msg/String
        beliefName: motor_status

      # Motor speed
      - topicName: /arduino/motor/speed/status
        topicType: std_msgs/msg/String
        beliefName: motor_speed

      # Buzzer status
      - topicName: /arduino/buzzer/status
        topicType: std_msgs/msg/String
        beliefName: buzzer_status

      # Headlight status
      - topicName: /arduino/headlight/status
        topicType: std_msgs/msg/String
        beliefName: headlight_status

      # Turn signal status
      - topicName: /arduino/turn_signal/status
        topicType: std_msgs/msg/String
        beliefName: turn_signal_status

      # Brake light status
      - topicName: /arduino/brake_light/status
        topicType: std_msgs/msg/Bool
        beliefName: brake_light_status

      # Ambient luminosity (LDR)
      - topicName: /arduino/light_sensor/reading
        topicType: std_msgs/msg/Float32
        beliefName: luminosity

      # Ultrasonic distance sensor
      - topicName: /arduino/ultrasonic_sensor/distance
        topicType: std_msgs/msg/Float32
        beliefName: distance

      # Left infrared line sensor
      - topicName: /arduino/line_sensor/left
        topicType: std_msgs/msg/Float32
        beliefName: line_left

      # Right infrared line sensor
      - topicName: /arduino/line_sensor/right
        topicType: std_msgs/msg/Float32
        beliefName: line_right


  
  actions:
   
    topicWritingActions:

      # Motor direction
      - actionName: move
        topicName: /arduino/motor/command
        topicType: std_msgs/msg/String

      # Motor speed
      - actionName: motorSpeed
        topicName: /arduino/motor/speed/command
        topicType: std_msgs/msg/String

      # Buzzer
      - actionName: buzzer
        topicName: /arduino/buzzer/command
        topicType: std_msgs/msg/String

      # Headlight
      - actionName: headlight
        topicName: /arduino/headlight/command
        topicType: std_msgs/msg/String

      # Turn signal
      - actionName: turnSignal
        topicName: /arduino/turn_signal/command
        topicType: std_msgs/msg/String

      # Brake light
      - actionName: brakeLight
        topicName: /arduino/brake_light/command
        topicType: std_msgs/msg/Bool